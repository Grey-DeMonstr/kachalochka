name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$RUNNER_TEMP/release-notes.txt"

          # A version header is the only line that is exactly X.Y.Z, so the
          # section runs from one to the next.
          awk -v v="$VERSION" '
            $0 == v { inside = 1; next }
            /^[0-9]+\.[0-9]+\.[0-9]+$/ { inside = 0 }
            inside && (NF || started) { started = 1; print }
          ' changelog.txt > "$NOTES"

          if ! grep -q '[^[:space:]]' "$NOTES"; then
            echo "::error::changelog.txt has no entry for $VERSION. Add its section first."
            exit 1
          fi

      - name: Restore the signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PversionName="${GITHUB_REF_NAME#v}"

      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.txt
          files: app/build/outputs/apk/release/app-release.apk

[versions]
kotlin = "2.4.20"
agp = "9.3.1"
composeMultiplatform = "1.12.0"
androidCompileSdk = "37"
androidMinSdk = "29"
coroutines = "1.11.0"
serialization = "1.11.0"
koin = "4.2.2"
sqldelight = "2.3.2"
supabase = "3.8.0"
ktor = "3.5.2"
navigation = "2.9.2"
navigationEvent = "1.1.0"
lifecycle = "2.11.0"
turbine = "1.2.1"
datastore = "1.2.1"
kotlinxBrowser = "0.5.0"
activityCompose = "1.13.0"
credentials = "1.6.0"
googleId = "1.2.1"
ktlintPlugin = "14.2.0"

[libraries]
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }

supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-storage = { module = "io.github.jan-tennert.supabase:storage-kt" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt" }

ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[libraries.kotlinx-coroutines-core]
module = "org.jetbrains.kotlinx:kotlinx-coroutines-core"
version.ref = "coroutines"

[libraries.kotlinx-coroutines-test]
module = "org.jetbrains.kotlinx:kotlinx-coroutines-test"
version.ref = "coroutines"

[libraries.kotlinx-coroutines-swing]
module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing"
version.ref = "coroutines"

[libraries.kotlinx-serialization-json]
module = "org.jetbrains.kotlinx:kotlinx-serialization-json"
version.ref = "serialization"

[libraries.koin-compose-viewmodel]
module = "io.insert-koin:koin-compose-viewmodel"
version.ref = "koin"

[libraries.sqldelight-driver-android]
module = "app.cash.sqldelight:android-driver"
version.ref = "sqldelight"

[libraries.sqldelight-driver-jvm]
module = "app.cash.sqldelight:sqlite-driver"
version.ref = "sqldelight"

[libraries.navigation-compose]
module = "org.jetbrains.androidx.navigation:navigation-compose"
version.ref = "navigation"

[libraries.navigationevent-compose]
module = "org.jetbrains.androidx.navigationevent:navigationevent-compose"
version.ref = "navigationEvent"

[libraries.lifecycle-viewmodel-compose]
module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose"
version.ref = "lifecycle"

[libraries.androidx-activity-compose]
module = "androidx.activity:activity-compose"
version.ref = "activityCompose"

[libraries.androidx-credentials]
module = "androidx.credentials:credentials"
version.ref = "credentials"

[libraries.androidx-credentials-play-services-auth]
module = "androidx.credentials:credentials-play-services-auth"
version.ref = "credentials"

[libraries.google-id]
module = "com.google.android.libraries.identity.googleid:googleid"
version.ref = "googleId"

[libraries.androidx-datastore-preferences-core]
module = "androidx.datastore:datastore-preferences-core"
version.ref = "datastore"

[libraries.kotlinx-browser]
module = "org.jetbrains.kotlinx:kotlinx-browser"
version.ref = "kotlinxBrowser"

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
